<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e5bb8">
<title>韩语每日训练</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="kr-icon-192.png">
<link rel="apple-touch-icon" href="kr-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
/* 韩语每日训练 v1 样式 */
/* 韩语每日训练 v1 · 单文件 App 样式（移动优先，深浅色自适应） */
:root{
  --accent:#1e5bb8; --accent2:#cd2e3a;
  --bg:#f4f4f1; --card:#ffffff; --text:#1c1e21; --muted:#697077; --line:#e3e5e8;
  --ok:#0a8a3a; --bad:#d64545; --soft:#eef2f8;
  --radius:14px;
}
html[data-dark="1"]{
  --bg:#121417; --card:#1d2024; --text:#e8eaed; --muted:#9aa0a6; --line:#2a2e33;
  --ok:#4ade80; --bad:#f87171; --soft:#23272c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.55 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  padding-bottom:76px; overscroll-behavior-y:contain;
}
.ko{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.3}
a{color:var(--accent)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-user-select:none;user-select:none}
#app{max-width:640px;margin:0 auto;padding:10px 14px}

/* ---- 顶栏 ---- */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 2px 6px}
.topbar .tb-back{width:34px;height:34px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 1px 3px rgba(0,0,0,.08);flex:0 0 auto}
.topbar h2{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .tb-act{font-size:13px;color:var(--accent);flex:0 0 auto;padding:6px 4px}

/* ---- 通用卡片/区块 ---- */
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card.tight{padding:10px 12px}
.hint{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.small{font-size:13px}
.big{font-size:20px;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.divider{height:1px;background:var(--line);margin:10px 0}

/* ---- 按钮 ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--accent);color:#fff;border-radius:12px;padding:11px 18px;font-size:15px;font-weight:600;
  box-shadow:0 2px 6px rgba(0,0,0,.14);transition:transform .06s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--soft);color:var(--accent);box-shadow:none}
.btn.gray{background:var(--soft);color:var(--text);box-shadow:none}
.btn.warn{background:var(--accent2)}
.btn.ok{background:var(--ok)}
.btn.wide{width:100%;padding:14px;font-size:16px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px;box-shadow:none}
.btn:disabled{opacity:.45}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1;min-width:100px}

/* ---- 徽章 / 进度 ---- */
.chip{display:inline-block;background:var(--soft);color:var(--accent);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;margin:2px 4px 2px 0}
.chip.on{background:var(--accent);color:#fff}
.chip.red{background:var(--accent2);color:#fff}
.chip.gray{background:var(--soft);color:var(--muted)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.red>i{background:var(--accent2)}
.pct{font-size:12px;color:var(--muted);margin-top:3px}

/* ---- 首页宫格 ---- */
.tile{background:var(--card);border-radius:var(--radius);padding:14px 12px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tile .t-ico{font-size:26px;line-height:1.2}
.tile .t-name{font-weight:700;margin-top:4px;font-size:15px}
.tile .t-sub{font-size:11px;color:var(--muted);margin-top:2px}

/* ---- 今日进度线 ---- */
.dots{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.dots i{width:16px;height:5px;border-radius:3px;background:var(--soft)}
.dots i.cur{background:var(--accent);outline:1px solid var(--accent);outline-offset:1px}
.dots i.done-ok{background:var(--ok)}
.dots i.done-bad{background:var(--bad)}

/* ---- 测验 ---- */
.qcard{background:var(--card);border-radius:var(--radius);padding:18px 16px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.qtag{font-size:12px;color:var(--muted);margin-bottom:8px}
.qtext{font-size:18px;font-weight:700;margin:6px 0 2px}
.qko{font-size:26px;font-weight:700;margin:8px 0 4px;line-height:1.35}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;font-size:16px;transition:border-color .12s}
.opt:active{border-color:var(--accent)}
.opt.ko{font-size:19px}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.explain{background:var(--soft);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.explain .verdict{font-weight:700;margin-bottom:4px}
.explain .verdict.ok{color:var(--ok)}
.explain .verdict.bad{color:var(--bad)}
.ansline{color:var(--ok);font-weight:700}

/* ---- 音频按钮 ---- */
.spk{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--accent);
  border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.spk:active{opacity:.8}
.spk.mini{padding:5px 10px;font-size:12px}

/* ---- 字母卡片 ---- */
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.lcell{background:var(--card);border-radius:12px;padding:12px 4px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative}
.lcell .ko{font-size:27px;font-weight:700;display:block;line-height:1.25}
.lcell .zh{font-size:11px;color:var(--muted);display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcell.locked{opacity:.4}
.lcell.seen::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:99px;background:var(--ok)}
.lbig{font-size:64px;font-weight:800;text-align:center;margin:8px 0;line-height:1.2}
.ltips{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.lex{display:flex;align-items:baseline;gap:8px;font-size:17px;margin:6px 0}

/* ---- 词条列表 ---- */
.wrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .wko{font-size:19px;font-weight:700;min-width:76px}
.wrow .wzh{flex:1;min-width:0}
.wrow .wex{font-size:13px;color:var(--muted)}
.poschip{font-size:10px;background:var(--soft);color:var(--muted);border-radius:6px;padding:1px 6px;vertical-align:2px;margin-left:4px}

/* ---- 日历 ---- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:6px}
.cal i{aspect-ratio:1;border-radius:7px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted)}
.cal i.on{background:var(--accent);color:#fff}
.cal i.today{outline:2px solid var(--accent2);outline-offset:1px}

/* ---- 设置 ---- */
.setrow{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .sl{flex:1;min-width:0}
.setrow .sl b{display:block;font-size:15px}
.setrow .sl .hint{display:block}
.seg{display:flex;background:var(--soft);border-radius:10px;overflow:hidden}
.seg button{padding:7px 12px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
input[type=text],input[type=password],input[type=number],select,textarea{
  width:100%;background:var(--card);color:var(--text);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px}
input[type=range]{width:100%;accent-color:var(--accent)}
input:focus,select:focus{outline:none;border-color:var(--accent)}

/* ---- 模态 ---- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:18px}
.modal{background:var(--card);border-radius:18px;padding:18px;max-width:420px;width:100%;max-height:86vh;overflow:auto}
.modal h3{margin-top:0}

/* ---- toast ---- */
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(20,22,25,.92);color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;max-width:82vw;z-index:99;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}

/* ---- 底部导航 ---- */
.navbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.navbar button{flex:1;padding:7px 0 8px;font-size:11px;color:var(--muted);position:relative}
.navbar button .ni{display:block;font-size:20px;line-height:1.2}
.navbar button.on{color:var(--accent);font-weight:700}
.navbar button .bdg{position:absolute;top:3px;right:calc(50% - 22px);background:var(--accent2);color:#fff;font-size:10px;
  border-radius:99px;padding:1px 5px;font-weight:700}

/* ---- 证书 ---- */
.cert{border:3px double var(--accent);border-radius:16px;padding:22px;text-align:center;background:var(--card)}
.cert .ck{font-size:52px;font-weight:800;line-height:1.3}

/* ---- 桌面宽屏 ---- */
@media(min-width:1000px){
  #app{max-width:900px}
  .wide2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .wide2>.card{margin:0}
}

/* ---- 动画 ---- */
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .18s ease-out}
@keyframes fadein{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
.fadein{animation:fadein .22s ease-out}

</style>
</head>

ncs","ex":"점심에 뭐 먹어요?","exzh":"中午吃什么？"},{"ko":"무엇","zh":"什么","pos":"代","pack":"funcs","ex":"이것은 무엇이에요?","exzh":"这是什么？"},{"ko":"누구","zh":"谁","pos":"代","pack":"funcs","ex":"그 사람은 누구예요?","exzh":"那个人是谁？"},{"ko":"어디","zh":"哪里","pos":"代","pack":"funcs","ex":"화장실이 어디예요?","exzh":"洗手间在哪里？"},{"ko":"왜","zh":"为什么","pos":"副","pack":"funcs","ex":"한국 음식을 왜 좋아해요?","exzh":"为什么喜欢韩国菜？"},{"ko":"어떻게","zh":"怎么；怎样","pos":"副","pack":"funcs","ex":"학교에 어떻게 가요?","exzh":"怎么去学校？"},{"ko":"얼마나","zh":"多少（程度）；多么","pos":"副","pack":"funcs","ex":"학교까지 얼마나 걸려요?","exzh":"到学校要多长时间？"},{"ko":"몇","zh":"几；多少","pos":"数","pack":"funcs","ex":"지금 몇 시예요?","exzh":"现在几点？"},{"ko":"아주","zh":"很；非常","pos":"副","pack":"funcs","ex":"한국어는 아주 재미있어요.","exzh":"韩语非常有意思。"},{"ko":"너무","zh":"太；过于","pos":"副","pack":"funcs","ex":"요즘 너무 바빠요.","exzh":"最近太忙了。"},{"ko":"조금","zh":"一点儿","pos":"副","pack":"funcs","ex":"한국어를 조금 해요.","exzh":"我会说一点儿韩语。"},{"ko":"잘","zh":"好好地（擅长）","pos":"副","pack":"funcs","ex":"요리를 잘 해요.","exzh":"我很会做菜。"},{"ko":"다시","zh":"再；重新","pos":"副","pack":"funcs","ex":"다시 한번 말해 주세요.","exzh":"请再说一遍。"},{"ko":"먼저","zh":"先；首先","pos":"副","pack":"funcs","ex":"저는 밥을 먼저 먹어요.","exzh":"我先吃饭。"},{"ko":"아직","zh":"还；尚未","pos":"副","pack":"funcs","ex":"아직 시간이 있어요.","exzh":"还有时间。"},{"ko":"같이","zh":"一起","pos":"副","pack":"funcs","ex":"친구와 같이 가요.","exzh":"和朋友一起去。"},{"ko":"항상","zh":"总是","pos":"副","pack":"funcs","ex":"저는 아침에 항상 커피를 마셔요.","exzh":"我早上总是喝咖啡。"},{"ko":"자주","zh":"经常","pos":"副","pack":"funcs","ex":"주말에 자주 운동해요.","exzh":"周末经常运动。"},{"ko":"가끔","zh":"偶尔；有时","pos":"副","pack":"funcs","ex":"가끔 영화를 봐요.","exzh":"偶尔看电影。"},{"ko":"모두","zh":"都；全部","pos":"副","pack":"funcs","ex":"친구들이 모두 한국을 좋아해요.","exzh":"朋友们都喜欢韩国。"},{"ko":"그리고","zh":"然后；还有","pos":"副","pack":"funcs","ex":"저는 학교에 가요. 그리고 공부해요.","exzh":"我去学校，然后学习。"},{"ko":"그래서","zh":"所以","pos":"副","pack":"funcs","ex":"늦었어요. 그래서 택시를 탔어요.","exzh":"迟到了，所以坐了出租车。"},{"ko":"하지만","zh":"但是","pos":"副","pack":"funcs","ex":"커피를 좋아해요. 하지만 자주 안 마셔요.","exzh":"我喜欢咖啡，但是不常喝。"},{"ko":"그런데","zh":"不过；可是","pos":"副","pack":"funcs","ex":"영화를 봤어요. 그런데 너무 길었어요.","exzh":"看了电影，不过太长了。"},{"ko":"그럼","zh":"那么","pos":"副","pack":"funcs","ex":"시간이 없어요. 그럼 내일 만나요.","exzh":"没有时间啊，那明天见吧。"}],"gram":[{"pat":"N은/는","name":"主题助词","desc":"接名词后：有收音用은，无收音用는。它标记句子的主题「说的是这个」，也常用于前后对比（저는 커피를 좋아해요，동생은 우유를 좋아해요）。与이/가分工：은/는提旧信息或做对比，이/가引出新信息；回答「누가（谁）」这类问句时必须用이/가。","ex":[{"ko":"저는 학생이에요.","zh":"我是学生。"},{"ko":"이 책은 재미있어요.","zh":"这本书很有趣。"},{"ko":"저는 커피를 좋아하고, 동생은 우유를 좋아해요.","zh":"我喜欢咖啡，而弟弟（妹妹）喜欢牛奶。"}],"quiz":{"q":"저 ____ 중국 사람이에요.","o":["은","는","이"],"a":1,"why":"저没有收音，主题助词用는；有收音的名词才用은，이是主格助词。"}},{"pat":"N이/가","name":"主格助词","desc":"接名词后：有收音用이，无收音用가。标记动作或状态的主体，回答「谁/什么」。当主语是新信息、要强调焦点时必须用이/가（누가 와요?—진수가 와요）；天气和自然现象也习惯用이/가（비가 와요）。与은/는对比：은/는是旧信息或对比，이/가是新信息焦点。","ex":[{"ko":"커피가 있어요.","zh":"有咖啡。"},{"ko":"비가 와요.","zh":"下雨了。"},{"ko":"누가 와요? — 진수가 와요.","zh":"谁要来？——真秀要来。"}],"quiz":{"q":"A: 누가 한국어를 공부해요? B: 마리아 ____ 공부해요.","o":["는","가","을"],"a":1,"why":"回答「누가（谁）」的问句，新信息主语要用主格助词가，不能用主题助词는。"}},{"pat":"N을/를","name":"宾格助词","desc":"接名词后：有收音用을，无收音用를，放在动词前面标记动作的对象（밥을 먹어요）。记忆规律：有收音配을/이/은，无收音配를/가/는，这条贯穿所有助词。口语里를偶尔省略，但初学阶段建议写全。易混点：别把宾格를和主格가用反，先想清楚谁是动作的承受者。","ex":[{"ko":"밥을 먹어요.","zh":"吃饭。"},{"ko":"한국어를 공부해요.","zh":"学习韩语。"},{"ko":"주말에 친구를 만나요.","zh":"周末和朋友见面。"}],"quiz":{"q":"빵 ____ 사요.","o":["을","를","이"],"a":0,"why":"빵有收音ㅇ，宾格助词用을；无收音的名词才用를，이是主格助词。"}},{"pat":"N입니다 / N(이에요/예요)","name":"判断句「是」","desc":"名词+입니다是格式体，用于正式场合；名词+이에요/예요是日常会话体。接法看收音：有收音用이에요（학생이에요），无收音用예요（의사예요），与은/는、이/가、을/를遵循同一条「有收音/无收音」规律。口语里是陈述还是提问靠语调区分（학생이에요?＝是学生吗？）。","ex":[{"ko":"저는 마리아예요.","zh":"我是玛丽亚。"},{"ko":"이것은 한국 음식이에요.","zh":"这是韩国食物。"},{"ko":"제 이름은 김민준입니다.","zh":"我的名字叫金敏俊。"}],"quiz":{"q":"저는 학생 ____.","o":["예요","이에요","였어요"],"a":1,"why":"학생有收音，判断句用이에요；예요只接无收音名词，였어요是过去时形式。"}},{"pat":"-ㅂ니다/습니다","name":"格式体终结词尾","desc":"接在词干后：无收音用ㅂ니다（가다→갑니다），有收音用습니다（먹다→먹습니다）。用于面试、演讲、对长辈的郑重表达，意思和해요体一样，只是更庄重。注意格式体的疑问句要换成-ㅂ니까?/습니까?；日常聊天基本用해요体，别混用。","ex":[{"ko":"감사합니다.","zh":"谢谢。"},{"ko":"만나서 반갑습니다.","zh":"见到您很高兴。"},{"ko":"저는 내일부터 출근합니다.","zh":"我从明天开始上班。"}],"quiz":{"q":"만나서 반갑 ____.","o":["ㅂ니다","습니다","어요"],"a":1,"why":"词干반갑-有收音ㅂ，格式体接습니다；无收音的词干才接ㅂ니다。"}},{"pat":"-아요/어요/여요","name":"해요体终结词尾","desc":"看词干最后一个母音：ㅏ/ㅗ接아요（가다→가요，좋다→좋아요），其他母音接어요（먹다→먹어요），하다固定变해요（공부하다→공부해요）。这是日常对话的默认语体，对长辈朋友都通用。易错点：不是가아요、하어요，缩合后的가요、해요要整词记牢。","ex":[{"ko":"지금 학교에 가요.","zh":"现在去学校。"},{"ko":"점심에 김치찌개를 먹어요.","zh":"中午吃泡菜汤。"},{"ko":"주말에 청소를 해요.","zh":"周末打扫卫生。"}],"quiz":{"q":"오늘 날씨가 좋____.","o":["아요","어요","해요"],"a":0,"why":"좋다词干좋-的母音是ㅗ，接아요变좋아요；어요配其他母音，해요只属于하다类动词。"}},{"pat":"안 + V / -지 않다","name":"否定","desc":"안放在动词、形容词前表示否定（안 가요 不去，안 바빠요 不忙）；-지 않다接在词干后（가지 않아요），语气稍正式一点。하다类动词要说공부를 안 해요。易混点：이다（是）和있다（有/在）的否定不用안，要分别用아니에요和없어요。","ex":[{"ko":"오늘은 회사에 안 가요.","zh":"今天不去公司。"},{"ko":"저는 아침밥을 먹지 않아요.","zh":"我不吃早饭。"},{"ko":"요즘 한국 드라마를 안 봐요.","zh":"最近不看韩剧。"}],"quiz":{"q":"저는 매운 음식을 좋아하지 ____.","o":["않아요","아니에요","없어요"],"a":0,"why":"动词否定接-지 않다变좋아하지 않아요；아니에요只用于名词判断句，없어요表示「没有」。"}},{"pat":"-았/었어요","name":"过去时","desc":"词干末母音是ㅏ/ㅗ接았어요（가다→갔어요），其他母音接었어요（먹다→먹었어요），하다变했어요（공부했어요）。母音相接时会缩合成一个音节。常与어제、지난주、벌써等时间词连用；不加-았/었어요就是现在时，时态全靠这个词尾区分。","ex":[{"ko":"어제 친구를 만났어요.","zh":"昨天见了朋友。"},{"ko":"주말에 제주도에 갔어요.","zh":"周末去了济州岛。"},{"ko":"어제 백화점에서 옷을 샀어요.","zh":"昨天在百货商店买了衣服。"}],"quiz":{"q":"어제 서울에 ____.","o":["가요","갔어요","가았어요"],"a":1,"why":"어제提示过去时；가다接았어요时ㅏ+았缩合成갔어요，不能写成가았어요。"}},{"pat":"-(으)ㄹ 거예요","name":"将来/推测","desc":"接在词干后：无收音或收音ㄹ直接加ㄹ 거예요（가다→갈 거예요，만들다→만들 거예요），有收音加을 거예요（먹다→먹을 거예요）。既表将来的打算（내일 갈 거예요），也表说话人的推测（비가 올 거예요）。注意拼写是거예요，不是것이에요；疑问句直接升调。","ex":[{"ko":"내일 부산에 갈 거예요.","zh":"明天要去釜山。"},{"ko":"저녁에 불고기를 먹을 거예요.","zh":"晚上要吃烤肉。"},{"ko":"오후에 비가 올 거예요.","zh":"下午可能会下雨。"}],"quiz":{"q":"내일 친구를 만 ____.","o":["을 거예요","ㄹ 거예요","었어요"],"a":1,"why":"만나다词干无收音，接-ㄹ 거예요变만날 거예요；有收音的词干才用-을 거예요。"}},{"pat":"N에","name":"에助词（时间·地点）","desc":"接名词后有三个用法：①时间点（3시에 만나요 三点见）；②目的地（학교에 가요 去学校）；③存在地点（집에 있어요 在家）。与에서对比：에是「到某处/在某处」的静止点，에서是「在某处做某事」的动作场所。易错点：어제、오늘、내일后面习惯不加에（내일 가요）。","ex":[{"ko":"아침 8시에 일어나요.","zh":"早上8点起床。"},{"ko":"학교에 가요.","zh":"去学校。"},{"ko":"지금 집에 있어요.","zh":"现在在家。"}],"quiz":{"q":"3시 ____ 만나요.","o":["에","에서","을"],"a":0,"why":"时间点用에；에서表示动作发生的场所，을是宾格助词。"}},{"pat":"N에서","name":"에서助词（场所·出发点）","desc":"接场所名词后：①动作发生的场所（도서관에서 공부해요 在图书馆学习）；②出发点（한국에서 왔어요 从韩国来）。与에对比：에连接「去某处/在某处」的静态位置，에서连接「在某处做某事」的动态行为；问「在哪里做某事」就说어디에서。","ex":[{"ko":"도서관에서 공부해요.","zh":"在图书馆学习。"},{"ko":"카페에서 커피를 마셔요.","zh":"在咖啡厅喝咖啡。"},{"ko":"한국에서 왔어요.","zh":"我来自韩国。"}],"quiz":{"q":"저는 도서관 ____ 한국어를 공부해요.","o":["에서","에","를"],"a":0,"why":"「学习」这个动作发生的场所用에서；에表示到达点或存在点，如도서관에 가요。"}},{"pat":"N도","name":"「也」助词","desc":"接名词后表「也」，会顶替掉이/가、은/는、을/를（저는→저도，커피를→커피도）。但和에、에서这类助词可以叠加（주말에도 일해요 周末也上班）。常用A도 B도「A也B也」列举。易混点：도和만是一对反义——도是「也」，만是「只」，方向刚好相反。","ex":[{"ko":"저도 학생이에요.","zh":"我也是学生。"},{"ko":"커피도 주세요.","zh":"也请给我咖啡。"},{"ko":"주말에도 회사에 가요.","zh":"周末也去公司。"}],"quiz":{"q":"A: 민수는 학생이에요. B: 저 ____ 학생이에요.","o":["도","만","는"],"a":0,"why":"「也」用도，直接替换掉主题助词는；만是「只」，意思相反。"}},{"pat":"N만","name":"「只」助词","desc":"接名词后表「只、仅」，限定范围：저는 커피만 마셔요（只喝咖啡）。만同样会替换이/가、은/는、을/를；与에、에서可叠加（주말에만 운동해요 只在周末运动）。数量词后加만还表「只……而已」（조금만 一点点）。对比도：「也」是增添，「只」是排除。","ex":[{"ko":"저는 커피만 마셔요.","zh":"我只喝咖啡。"},{"ko":"주말에만 운동해요.","zh":"只在周末运动。"},{"ko":"김치를 조금만 주세요.","zh":"泡菜请只给我一点点。"}],"quiz":{"q":"저는 아침에 우유 ____ 마셔요.（别的都不喝）","o":["만","도","는"],"a":0,"why":"「只」用만并替换原来的助词；도是「也」，方向刚好相反。"}},{"pat":"时间词 + 부터 ~ 까지","name":"「从…到…」（时间）","desc":"时间词后用부터表「从」、까지表「到」，框出时间段：9시부터 5시까지 근무해요（从9点工作到5点）。两者可以只出现一个（수업은 3시부터 시작해요 课从3点开始）。易混点：时间的起点用부터，空间的起点用에서，两个用法都配까지表终点，但起点助词不同。","ex":[{"ko":"9시부터 5시까지 근무해요.","zh":"从9点工作到5点。"},{"ko":"수업은 1시부터 시작해요.","zh":"课从1点开始。"},{"ko":"월요일부터 금요일까지 한국어를 배워요.","zh":"从周一到周五学韩语。"}],"quiz":{"q":"9시 ____ 12시까지 공부해요.","o":["부터","에서","만"],"a":0,"why":"时间段的起点用부터；에서只跟场所词搭配。"}},{"pat":"场所 + 에서 ~ 까지","name":"「从…到…」（空间）","desc":"场所词后用에서表起点、까지表终点：집에서 회사까지 버스로 가요（从家到公司坐公交去）。对比时间用法：时间段是3시부터 4시까지（부터），空间段是서울에서 대구까지（에서）。时间和空间还可以连用：9시에 집에서 학교까지 가요（9点从家去学校）。","ex":[{"ko":"집에서 회사까지 버스로 가요.","zh":"从家到公司坐公交去。"},{"ko":"여기에서 지하철역까지 가까워요.","zh":"从这里到地铁站很近。"},{"ko":"서울에서 대구까지 기차로 가요.","zh":"从首尔到大邱坐火车去。"}],"quiz":{"q":"집 ____ 학교까지 걸어가요.","o":["에서","부터","에"],"a":0,"why":"空间的起点用에서；부터只跟时间词搭配（9시부터）。"}},{"pat":"N의","name":"属格助词「的」","desc":"接名词后表所属，语序和中文一样：선생님의 책＝老师的书。疑问用누구의（谁的），口语常省略의说누구 책。常用缩合要记牢：저의→제（我的，谦称），나의→내（我的，平语），如제 가방＝我的包。의在口语里经常弱化甚至省略（우리 엄마＝我妈）。","ex":[{"ko":"이것은 제 가방이에요.","zh":"这是我的包。"},{"ko":"동생의 이름은 민수예요.","zh":"弟弟（妹妹）的名字叫民秀。"},{"ko":"저는 한국 친구의 집에 갈 거예요.","zh":"我要去韩国朋友的家。"}],"quiz":{"q":"이것은 선생님 ____ 책이에요.","o":["의","를","에"],"a":0,"why":"表示所属「的」用의；를是宾格助词，에是时间地点助词。"}},{"pat":"N과/와、하고","name":"「和」","desc":"连接两个名词：有收音用과（빵과 우유），无收音用와（커피와 설탕）——方向别记反：有收音才配과。하고不分有没有收音，口语里更随意（친구하고 영화 봐요）。易混点：와/과、하고只能连名词，要连接两个句子得用그리고；「或者」则用(이)나。","ex":[{"ko":"빵과 우유를 먹어요.","zh":"吃面包和牛奶。"},{"ko":"친구하고 영화를 봐요.","zh":"和朋友看电影。"},{"ko":"주말에 가족하고 여행을 갈 거예요.","zh":"周末要和家人去旅行。"}],"quiz":{"q":"빵 ____ 우유를 샀어요.","o":["과","와","에서"],"a":0,"why":"빵有收音ㅇ，用과；无收音的名词才用와，에서是场所助词。"}},{"pat":"N(이)나","name":"「或者」助词","desc":"名词后接나表选择「或者」：无收音用나（커피나 차），有收音用이나（빵이나 과자），在宾语位置还会替换을/를（라면이나 먹어요 吃个拉面之类）。数量词后加(이)나还表「大概、左右」：두 시간이나 걸려요＝花了两个小时左右。对比하고：「或者」二选一，「和」是并列。","ex":[{"ko":"커피나 차 주세요.","zh":"请给我咖啡或茶。"},{"ko":"저녁에 라면이나 먹을 거예요.","zh":"晚饭打算吃个拉面之类的。"},{"ko":"여기에서 공항까지 두 시간이나 걸려요.","zh":"从这里到机场要花两个小时左右。"}],"quiz":{"q":"점심에 김치찌개 ____ 먹을 거예요.","o":["나","이나","만"],"a":0,"why":"김치찌개无收音，表「或者」用나；有收音的名词才用이나，만是「只」。"}},{"pat":"名词+보다","name":"比较助词「比」","desc":"名词后直接加 보다，标记被比较的对象「比…」，句中常和 더（更）搭配：영화보다 책이 재미있어요（比起电影，书更有趣）。注意语序和中文相反：보다 前面是「被比的一方」，后面才是「更怎么样的一方」。易混点：처럼 是「像…一样」表示相似，不带比较的意思，同样接在名词后，千万别和 보다 混用。","ex":[{"ko":"저는 동생보다 키가 커요.","zh":"我比弟弟（妹妹）个子高。"},{"ko":"오늘은 어제보다 추워요.","zh":"今天比昨天冷。"},{"ko":"저는 커피보다 차를 더 자주 마셔요.","zh":"比起咖啡，我更常喝茶。"}],"quiz":{"q":"저는 형 ____ 키가 커요.","o":["처럼","보다","에서"],"a":1,"why":"「比…」用助词 보다，보다 前是被比的对象；처럼 是「像…一样」表相似，에서 是场所助词。"}},{"pat":"더 / 제일（가장）","name":"「更/最」","desc":"더 放在形容词、副词前表示「更」，用于两者比较，常和 보다 连用：사과보다 배를 더 좋아해요。제일（或 가장）放在形容词、副词前表示「最」，在多个对象或整体范围里取最高值。易混点：有 보다 时配 더；说「在…里最…」要用「范围+에서+제일」，如 우리 반에서 제일 커요，不能再出现 보다。","ex":[{"ko":"오늘은 어제보다 더 바빠요.","zh":"今天比昨天更忙。"},{"ko":"저는 배를 더 좋아해요.","zh":"我更喜欢梨。"},{"ko":"이 가게가 동네에서 제일 싸요.","zh":"这家店在小区里最便宜。"}],"quiz":{"q":"우리 반에서 키가 ____ 커요.","o":["더","보다","제일"],"a":2,"why":"「반에서（在班里）」给出了范围，范围内取最高用 제일；더 需要明确的比较对象，보다 前面必须接名词。"}},{"pat":"形容词+(으)ㄴ+名词","name":"形容词定语","desc":"形容词词干加 (으)ㄴ 再接名词，表示「…的名词」：예쁘다→예쁜 옷（漂亮的衣服）。词干有收音用 은（작은 집），无收音用 ㄴ（예쁜 옷）。核心记住一条：形容词修饰名词时永远用 (으)ㄴ。易混点：动词的现在时定语是 는（공부하는 학생），千万别把形容词写成 예쁘는 옷，这是中文母语学习者的高频错误。","ex":[{"ko":"저는 예쁜 옷을 좋아해요.","zh":"我喜欢漂亮的衣服。"},{"ko":"키가 큰 친구가 같이 갔어요.","zh":"个子高的朋友一起去了。"},{"ko":"이번 시험에는 어려운 문제가 많았어요.","zh":"这次考试难题很多。"}],"quiz":{"q":"생일 선물로 ____ 옷을 샀어요.","o":["예쁜","예쁘는","예쁘"],"a":0,"why":"形容词定语加 (으)ㄴ：예쁘다→예쁜；예쁘는 是把动词的 는 误用到形容词上，예쁘 则缺定语词尾。"}},{"pat":"动词+는+名词","name":"动词现在时定语","desc":"动词词干直接加 는 再接名词，表示「正在/平时做…的名词」：마시다→마시는 커피。不论词干有无收音都用 는，不必变化。易混点：形容词定语用 (으)ㄴ（예쁜 꽃），动词用 는（피는 꽃）；另外 마신 커피 是「喝过的」，마실 커피 是「将要喝的」，表现在千万不能写成 마신。","ex":[{"ko":"저는 한국어를 공부하는 학생이에요.","zh":"我是学习韩语的学生。"},{"ko":"지금 읽는 책이 정말 재미있어요.","zh":"现在读的这本书真有趣。"},{"ko":"이 근처에서 파는 빵이 유명해요.","zh":"这附近卖的面包很有名。"}],"quiz":{"q":"지금 ____ 커피는 라떼예요.","o":["마시는","마신","마실"],"a":0,"why":"动词现在时定语用 는；마신 是过去「喝过的」，마실 是将来「要喝的」，지금 提示的是现在。"}},{"pat":"-고 있다","name":"正在进行","desc":"动词词干加 고 있다，表示动作正在进行「正在…」：지금 밥을 먹고 있어요。句中常有 지금、요즘 等时间词提示动作此刻或近期持续进行。它还能表示状态的持续，如 입고 있어요（穿着）、앉아 있어요（坐着）。易混点：좋아하다、알다 这类状态词不用 -고 있다，不说 좋아하고 있어요，直接说 좋아해요。","ex":[{"ko":"지금 밥을 먹고 있어요.","zh":"现在正在吃饭。"},{"ko":"동생은 방에서 자고 있어요.","zh":"弟弟（妹妹）正在房间里睡觉。"},{"ko":"요즘 한국어를 배우고 있어요.","zh":"最近正在学韩语。"}],"quiz":{"q":"어머니는 지금 저녁을 ____.","o":["만들어요","만들었어요","만들고 있어요"],"a":2,"why":"지금 提示动作正在进行，要用 -고 있어요；만들어요 只表一般习惯或现在，만들었어요 是过去。"}},{"pat":"-(으)러 가다/오다","name":"「去做…」","desc":"动词词干加 (으)러，再接 가다/오다 等移动动词，表示移动的目的「去做…」：밥 먹으러 가요。有收音用 으러（먹으러），无收音用 러（가러），词干以 ㄹ 结尾也直接用 러（놀러）。易混点：-(으)러 只能搭配移动动词；表「打算做」的是 -(으)려고，两者只差一个字，千万别写混。","ex":[{"ko":"밥 먹으러 가요.","zh":"去吃饭。"},{"ko":"친구 만나러 시내에 갔어요.","zh":"进城去见朋友了。"},{"ko":"한국어를 배우러 한국에 왔어요.","zh":"为了学韩语来到了韩国。"}],"quiz":{"q":"서점에 책을 ____ 가요.","o":["사러","사서","살"],"a":0,"why":"「去做…」的移动目的用 -(으)러 가다；사서 表示「买了之后」的先后顺序，살 是将来定语，不能这样接。"}},{"pat":"-(으)려고 하다","name":"「打算做…」","desc":"动词词干加 (으)려고 하다，表示打算、意图「打算做…」，说的通常是计划中还没发生的事：주말에 여행하려고 해요。有收音用 으려고，无收音用 려고。易混点：-고 싶다 只是单纯想做，려고 하다 带着具体计划的意味；-(으)러 只能接移动动词，려고 하다 可以接任何动词。","ex":[{"ko":"주말에 영화를 보려고 해요.","zh":"打算周末看电影。"},{"ko":"지금 나가려고 해요.","zh":"我现在打算出门。"},{"ko":"내년에 유학을 가려고 해요.","zh":"打算明年去留学。"}],"quiz":{"q":"주말에 한국어를 ____ 해요.","o":["공부하러","공부해서","공부하려고"],"a":2,"why":"「打算做…」用 -(으)려고 하다；-(으)러 只能接 가다/오다 等移动动词，공부하러 해요 不成立；공부해서 表原因或先后，也不表示打算。"}},{"pat":"-(으)면","name":"条件「如果」","desc":"动词、形容词词干加 (으)면，表示假设「如果…的话」：시간이 있으면 같이 가요。有收音用 으면，无收音用 면，前句也可以用过去时。易混点：-(으)면 是条件还没发生的假设；-(으)니까 是「因为/既然」，原因已经成立，后面常接命令句，两者对比是 TOPIK 初级高频考点。","ex":[{"ko":"시간이 있으면 같이 가요.","zh":"有时间的话一起去吧。"},{"ko":"비가 오면 집에 있을 거예요.","zh":"下雨的话就待在家里。"},{"ko":"궁금한 게 있으면 언제든지 전화하세요.","zh":"如果有疑问，随时打电话。"}],"quiz":{"q":"내일 시간이 ____ 만나요.","o":["있으면","있어도","있는데"],"a":0,"why":"「如果…就」表示假设条件用 -(으)면；있어도 是「即使…也」，条件和结果的关系正好相反；있는데 只是铺垫背景，不表条件。"}},{"pat":"-지만","name":"转折「但是」","desc":"动词、形容词词干加 지만，连接前后对立的两件事「…但是…」：한국어는 어렵지만 재미있어요。过去时用 았/었지만（갔지만），前句主语用 은/는 时也常配合对比。易混点：-지만 是干脆明确的对立转折；-는데 是委婉的铺垫或轻微转折，暗示「还有下文」，口语里其实更常用，别把所有「但是」都译成 지만。","ex":[{"ko":"김치를 좋아하지만 자주 못 먹어요.","zh":"我喜欢泡菜，但不常吃。"},{"ko":"한국어는 어렵지만 재미있어요.","zh":"韩语难，但是有趣。"},{"ko":"공항에 갔지만 비행기를 놓쳤어요.","zh":"去了机场，但是错过了飞机。"}],"quiz":{"q":"한국어는 어려____ 재미있어요.","o":["서","지만","러"],"a":1,"why":"前后是转折关系用 -지만；어려서 变成「因为难所以有趣」，意思不通；어려러 不是正确的词形。"}},{"pat":"-고","name":"并列「并且」","desc":"动词、形容词词干加 고，并列两个动作或状态「…并且/还…」：크고 달아요（又大又甜），也可表动作先后：먹고 마셔요（吃完再喝）。注意过去时只体现在最后一个谓语上：어제 밥을 먹고 영화를 봤어요。易混点：고 没有转折义，别和 지만 混；两个动作有紧密的因果或连续关系时要用 -아서/어서。","ex":[{"ko":"이 사과는 크고 달아요.","zh":"这个苹果又大又甜。"},{"ko":"아침에 밥을 먹고 커피를 마셔요.","zh":"早上吃完饭然后喝咖啡。"},{"ko":"어제 도서관에 가고 친구를 만났어요.","zh":"昨天去了图书馆，还见了朋友。"}],"quiz":{"q":"이 빵은 크____ 달아요.","o":["면","서","고"],"a":2,"why":"「又…又…」的并列用 -고；크면 是假设「如果大」，크서 表原因，都不表并列。"}},{"pat":"-아서/어서","name":"原因「所以」/顺序「然后」","desc":"词干加 아서/어서（하다→해서）有两个用法：表原因「因为…所以」：배가 아파서 병원에 갔어요；表动作先后「…然后」：일어나서 세수를 했어요。最重要的限制：后面不能接命令句和共动句。易混点：「因为忙，休息吧」要说 바쁘니까 쉬세요，不能说 바빠서 쉬세요，劝人做事时要用 -(으)니까。","ex":[{"ko":"배가 아파서 병원에 갔어요.","zh":"肚子疼，所以去了医院。"},{"ko":"아침에 일어나서 세수를 했어요.","zh":"早上起床后洗漱了。"},{"ko":"비가 와서 집에 일찍 왔어요.","zh":"下雨了，所以早早回家了。"}],"quiz":{"q":"지금은 시간이 없____ 나중에 전화하세요.","o":["으니까","어서","으면"],"a":0,"why":"-아서/어서 后不能接命令句，劝对方做事并说明原因时要用 -(으)니까；없으면 只是假设「如果没时间」。"}},{"pat":"-(으)니까","name":"原因「因为」","desc":"动词、形容词词干加 (으)니까，表示原因「因为…所以…」：시간이 있으니까 천천히 하세요。有收音用 으니까，无收音用 니까。最大特点是后句可以接命令句、共动句和提议。易混点：-아서/어서 也表原因，但后面不能接命令或提议；「说原因+劝人做事」只能用 -(으)니까，这是两者对比的核心考点。","ex":[{"ko":"시간이 있으니까 천천히 하세요.","zh":"有时间，慢慢做吧。"},{"ko":"날씨가 좋으니까 공원에 갈까요?","zh":"天气好，我们去公园怎么样？"},{"ko":"표를 샀으니까 걱정하지 마세요.","zh":"票已经买了，别担心。"}],"quiz":{"q":"밖이 추____ 옷을 더 입으세요.","o":["우니까","워서","우면"],"a":0,"why":"后句是命令句，表原因只能用 -(으)니까；추워서 接命令句不成立，추우면 是假设「如果冷」。"}},{"pat":"-는데/(으)ㄴ데","name":"铺垫/委婉语尾","desc":"动词词干加 는데，形容词词干加 (으)ㄴ데，名词和 이다 后加 인데，过去时用 았/었는데。三种功能：铺垫背景引出后句、轻微转折、委婉提问或拒绝：옷을 샀는데 좀 작아요。易混点：-지만 是干脆的对立转折，는데 更委婉、暗示「还有下文」，客气拒绝或提要求时韩国人习惯用 는데。","ex":[{"ko":"옷을 샀는데 좀 작아요.","zh":"买了衣服，可是有点小。"},{"ko":"저는 한국어를 공부하는데 궁금한 게 있어요.","zh":"我在学韩语，有个问题想请教。"},{"ko":"내일 시간이 있는데 같이 영화 볼래요?","zh":"明天有空，要不要一起看电影？"}],"quiz":{"q":"오늘은 월요일____ 회사에 가야 해요.","o":["는데","인데","지만"],"a":1,"why":"名词和 이다 后接 인데：월요일인데；는데 是动词词尾，지만 直接接名词也不成立（要说 이지만）。"}},{"pat":"-아/어 주세요","name":"请求「请帮我」","desc":"动词加 아/어 주세요，表示请对方为自己（我方）做事，即「请帮我做…」：사진 좀 찍어 주세요（请帮我拍张照）。常和 좀 搭配，比单纯的 -세요 更客气，多一层「为我」的请求感。易混点：-세요 只是单纯指示「请做」；反过来，想主动提出为对方做时用 -아/어 줄까요?（要我帮你做吗），两个方向别搞反。","ex":[{"ko":"조금만 기다려 주세요.","zh":"请稍等一下。"},{"ko":"사진 좀 찍어 주세요.","zh":"请帮我拍张照。"},{"ko":"이 문장을 한국어로 설명해 주세요.","zh":"请帮我把这个句子用韩语解释一下。"}],"quiz":{"q":"사진 좀 ____.","o":["찍을게요","찍으세요","찍어 주세요"],"a":2,"why":"请对方为我做事要用 -아/어 주세요；찍으세요 只是单纯指示「请拍」，찍을게요 是「我来拍」的承诺。"}},{"pat":"-(으)ㄹ 수 있다/없다","name":"能力「能/会」","desc":"动词词干加 (으)ㄹ 수 있다/없다，表示能力或可能性「能/会做」：수영을 할 수 있어요。有收音用 을 수（먹을 수），无收音用 ㄹ 수（할 수）。这是初级表达能力的核心句型，频率很高。易混点：它说的是客观能力或条件允许与否；「想做」要用 -고 싶어요，「擅长」说 잘해요，三者问的问题不同，别混用。","ex":[{"ko":"저는 매운 음식을 먹을 수 있어요.","zh":"我能吃辣。"},{"ko":"수영을 할 수 있어요?","zh":"你会游泳吗？"},{"ko":"일이 많아서 오늘은 갈 수 없어요.","zh":"事情很多，今天去不了。"}],"quiz":{"q":"수영을 ____?","o":["할 수 있어요","하고 싶어요","할게요"],"a":0,"why":"问能力「会不会」用 -(으)ㄹ 수 있어요?；하고 싶어요 是「想做」，할게요 是「我会去做」的承诺，都不问能力。"}},{"pat":"-아/어도","name":"让步「即使…也」","desc":"词干加 아/어도（하다→해도），表示让步「即使…也…」：비가 와도 갈 거예요。前句可以是假设，也可以是承认的事实，后句结果不因条件改变。易混点：-(으)면 是普通条件「如果…就」，아/어도 是「即使…也」，一字之差意思完全不同（있으면 가요 vs 있어도 안 가요），考题最爱把两者放在一起对比。","ex":[{"ko":"비가 와도 갈 거예요.","zh":"即使下雨也去。"},{"ko":"피곤해도 운동을 해요.","zh":"即使累也运动。"},{"ko":"비싸도 한 번 먹어 보고 싶어요.","zh":"即使贵也想尝一次。"}],"quiz":{"q":"피곤____ 운동을 해요.","o":["하지만","해도","하면"],"a":1,"why":"「即使累也运动」表示让步，用 -아/어도；하지만 只是并列两个对立的事实，不带「即使」的让步义；하면 则变成「如果累就运动」，意思全变了。"}},{"pat":"-기 전에","name":"「在…之前」","desc":"动词词干加 기 전에，表示「在做…之前」：자기 전에 책을 읽어요（睡觉前看书）。기 前面直接接动词词干，不体现时态变化，过去的事也说 오기 전에；名词则不加 기，直接用 전에（식사 전에）。易混点：和 -(으)ㄴ 후에 方向正好相反，千万别记反；另外别多加定语词尾，写成 자는 전에、자고 전에 这类形式都是错的。","ex":[{"ko":"자기 전에 책을 읽어요.","zh":"睡觉前看书。"},{"ko":"밥을 먹기 전에 손을 씻으세요.","zh":"吃饭前请洗手。"},{"ko":"한국에 오기 전에 한국어를 조금 공부했어요.","zh":"来韩国之前学过一点韩语。"}],"quiz":{"q":"____ 책을 읽어요.","o":["자는 전에","자기 전에","자고 전에"],"a":1,"why":"-기 전에 直接接动词词干：자기 전에＝睡觉前；자는、자고 后再接 전에 都是多加了词尾的典型错误。"}},{"pat":"-(으)ㄴ 후에","name":"「在…之后」","desc":"动词词干加 (으)ㄴ 后接 후에，表示「在做…之后」：밥을 먹은 후에 커피를 마셔요。有收音用 은 후에，无收音用 ㄴ 후에；名词不加词尾，直接加 후에（수업 후에）。按时间顺序叙述一天经历时特别常用。易混点：接 후에 用定语形 (으)ㄴ，别写成 먹는 후에；和 -기 전에 方向正好相反，千万别记反。","ex":[{"ko":"밥을 먹은 후에 커피를 마셔요.","zh":"吃完饭后喝咖啡。"},{"ko":"수업이 끝난 후에 도서관에 가요.","zh":"下课后去图书馆。"},{"ko":"결혼한 후에 고향으로 이사했어요.","zh":"结婚后搬回了老家。"}],"quiz":{"q":"밥을 먹____ 산책해요.","o":["는 후에","기 후에","은 후에"],"a":2,"why":"动词+후에 用定语形 (으)ㄴ：먹은 후에；먹는 후에、먹기 후에 都是错误接法，「之前」才是 -기 전에。"}},{"pat":"있어요/없어요","name":"存在与所有","desc":"接法：名词＋이/가＋있어요或없어요。核心用法：既表「拥有」也表「存在」：시간이 있어요＝有时间，동생이 없어요＝没有妹妹；问「有没有、在不在」全靠它。易混点：人、物「在」某处用场所＋에，如 교실에 선생님이 있어요；活动「在某处举行」要用에서，如 회의가 3층에서 있어요。","ex":[{"ko":"책상 위에 책이 있어요.","zh":"桌子上有书。"},{"ko":"오늘은 시간이 없어요.","zh":"今天没有时间。"},{"ko":"회의가 3시에 2층 회의실에서 있어요.","zh":"会议3点在2楼会议室举行。"}],"quiz":{"q":"想说「教室里有老师」，正确的是？","o":["교실에서 선생님이 있어요.","교실에 선생님이 있어요.","교실에 선생님을 있어요."],"a":1,"why":"人「在」处所用「处所＋에＋이/가 있어요」；에서 用于活动举行地，을 是宾语助词，不能这么接。"}},{"pat":"-(으)ㄹ까요?","name":"提议与询问意愿","desc":"接法：动词词干无收音接ㄹ까요，有收音接을까요。核心用法：一是提议和对方一起做，같이 갈까요?＝一起走好吗；二是礼貌询问对方意愿，창문을 열까요?＝要开窗吗，比命令委婉。易混点：-(으)ㅂ시다 是直接拍板的「一起…吧」，-ㄹ까요? 是商量的「…好吗」，邀约时更常用后者。","ex":[{"ko":"점심에 같이 밥 먹을까요?","zh":"中午一起吃饭好吗？"},{"ko":"창문을 열까요?","zh":"要开窗吗？"},{"ko":"내일 몇 시에 만날까요?","zh":"明天几点见面呢？"}],"quiz":{"q":"想礼貌提议「我们一起看电影吧」，最合适的是？","o":["같이 영화를 봐요.","같이 영화를 보세요.","같이 영화를 볼까요?"],"a":2,"why":"-(으)ㄹ까요? 是商量式提议「一起…好吗？」；봐요 只是平淡陈述，보세요 变成命令对方「请看」。"}},{"pat":"-(으)ㅂ시다","name":"共动（正式）","desc":"接法：动词词干无收音接ㅂ시다，有收音接읍시다，如 갑시다、먹읍시다、합시다。核心用法：格式体共动形「一起…吧」，用于演讲、会议、标语等正式场合，干脆有力。易混点：对长辈、上级别直接用，听着像命令，可改用 -(으)세요；朋友口语更常说 -자，如 가자。","ex":[{"ko":"같이 갑시다.","zh":"一起走吧。"},{"ko":"3시에 정문 앞에서 만납시다.","zh":"3点在正门前碰面吧。"},{"ko":"여러분, 조용히 합시다.","zh":"各位，请安静下来吧。"}],"quiz":{"q":"会议上号召大家「开始开会吧」，最正式得体的是？","o":["회의를 시작합시다.","회의를 시작해요.","회의를 시작할까요?"],"a":0,"why":"-(으)ㅂ시다 是格式体共动，正式号召场合最合适；-할까요? 是商量口吻的「好吗？」，해요 只是陈述句。"}},{"pat":"-지 마세요","name":"请不要做","desc":"接法：动词词干＋지 마세요，来自 하지 말다「不要做」。核心用法：礼貌劝阻对方「请不要做某事」，如 사진을 찍지 마세요＝别拍照，걱정하지 마세요＝别担心，标语和安慰都用它。易混点：-(으)면 안 되다 是陈述「不可以」的规则；-지 마세요 是当面对听话人说的「别做」，更像叮嘱。","ex":[{"ko":"여기서 담배를 피우지 마세요.","zh":"请不要在这里抽烟。"},{"ko":"수업 시간에 전화하지 마세요.","zh":"上课时间请不要打电话。"},{"ko":"걱정하지 마세요. 제가 갈게요.","zh":"别担心，我会去的。"}],"quiz":{"q":"想告诉访客「请不要进去」，应说？","o":["들어가세요.","들어가지 마세요.","들어가면 돼요."],"a":1,"why":"-지 마세요 表礼貌禁止「别做」；들어가세요 是「请进」，들어가면 돼요 是「可以进去」，意思完全相反。"}},{"pat":"-아/어 보다","name":"试试看","desc":"接法：动词词干＋아/어＋보다。核心用法：表「试着做做看」，보다 已失去「看」的意思，中文不能直译：입어 보다＝试穿，먹어 보다＝尝尝；请对方尝试用 -아/어 보세요，如 한번 입어 보세요。易混点：别和 -아/어 보이다「看起来」弄混，예뻐 보여요 是「看起来漂亮」，两者不同。","ex":[{"ko":"이 신발을 한번 신어 보세요.","zh":"请试穿一下这双鞋。"},{"ko":"저는 한국 라면을 만들어 봤어요.","zh":"我试着做过韩式拉面。"},{"ko":"모르면 저한테 전화해 보세요.","zh":"不明白的话，试着给我打电话吧。"}],"quiz":{"q":"服装店店员请客人「请试穿这件衣服」，应说？","o":["이 옷을 입어 보여요.","이 옷을 입으면 안 돼요.","이 옷을 입어 보세요."],"a":2,"why":"-아/어 보다 表「试着做」，입어 보세요＝请试穿；보이다 是「看起来」，면 안 돼요 是禁止「不可以穿」。"}},{"pat":"-(으)ㄴ/은 적이 있다","name":"做过的经历","desc":"接法：动词词干无收音接ㄴ，有收音接은，再加 적이 있다，否定用 없다。核心用法：表「有没有做过的经历」，간 적이 있어요＝去过，먹은 적이 없어요＝没吃过，常和 한 번 搭配。易混点：ㄴ/은 已含过去义，别再加过去时标记；和 -아/어 봤어요 相比，本句型更客观陈述经历。","ex":[{"ko":"김치를 먹은 적이 있어요.","zh":"我吃过泡菜。"},{"ko":"저는 한국에 간 적이 없어요.","zh":"我没有去过韩国。"},{"ko":"혼자 여행을 한 적이 있어요?","zh":"你有一个人旅行的经历吗？"}],"quiz":{"q":"想问对方「你吃过参鸡汤吗（有没有吃过）」，最地道的是？","o":["삼계탕을 먹은 적이 있어요?","삼계탕을 먹으러 갈까요?","삼계탕을 먹으면 돼요?"],"a":0,"why":"问「有没有做过」用 -(으)ㄴ 적이 있어요?；ㄹ까요? 是邀约「一起去吃吗」，면 돼요? 是「可以吃吗」。"}},{"pat":"-(으)면서","name":"一边一边","desc":"接法：动词词干无收音或ㄹ收音接면서，其他收音接으면서。核心用法：同一主语的两个动作同时进行，「一边…一边…」，如 음악을 들으면서 공부해요。易混点：必须同一主语、同时进行；主语不同或只是先后发生要用 -고，如 저는 공부하고 동생은 운동해요，不能硬套 -(으)면서。","ex":[{"ko":"음악을 들으면서 공부해요.","zh":"一边听音乐一边学习。"},{"ko":"밥을 먹으면서 드라마를 봐요.","zh":"一边吃饭一边看电视剧。"},{"ko":"커피를 마시면서 친구랑 이야기했어요.","zh":"一边喝咖啡一边和朋友聊天了。"}],"quiz":{"q":"想说「一边吃饭一边看电视」，正确的是？","o":["밥을 먹는 TV를 봐요.","밥을 먹으면서 TV를 봐요.","밥을 먹으면서 TV를 보세요."],"a":1,"why":"-(으)면서 连接同一主语同时进行的两个动作；-는 是定语形式接不上，보세요 变成命令「请看」。"}},{"pat":"-아/어야 되다(하다)","name":"必须","desc":"接法：动词词干＋아/어＋야 되다，口语也常说 야 하다。核心用法：表义务「必须、得做」，如 가야 돼요＝得走了，해야 해요＝必须做；되다 和 하다 可互换。易混点：和 -(으)면 안 되다 是一对反义——「必须做」用 아/어야 되다，「不可以做」用 면 안 되다，考试爱放一起考。","ex":[{"ko":"내일 7시에 일어나야 돼요.","zh":"明天必须7点起床。"},{"ko":"여기서는 조용히 해야 해요.","zh":"在这里必须保持安静。"},{"ko":"숙제를 오늘 밤까지 다 끝내야 돼요.","zh":"作业必须今晚之前全部做完。"}],"quiz":{"q":"老师要求「明天9点前必须到校」，正确的是？","o":["내일 9시까지 학교에 오면 안 돼요.","내일 9시까지 학교에 올 수 있어요.","내일 9시까지 학교에 와야 돼요."],"a":2,"why":"「必须」用 -아/어야 되다；면 안 돼요 是「不可以来」意思相反，ㄹ 수 있어요 只是「能来」，没有必须感。"}},{"pat":"-(으)면 안 되다","name":"不可以","desc":"接法：动词词干＋(으)면＋안 되다。核心用法：表示「不可以做某事」，如 피우면 안 돼요＝不可以抽；也常回答 -아/어도 돼요?：아니요, 하면 안 돼요。易混点：和 -지 마세요 都能禁止，但 -지 마세요 是当面命令「别做」，本句型是说明规则、提醒「不可以」，语气更客观。","ex":[{"ko":"여기서 담배를 피우면 안 돼요.","zh":"这里不可以抽烟。"},{"ko":"수업 시간에 자면 안 돼요.","zh":"上课时间不可以睡觉。"},{"ko":"도서관에서 큰 소리로 떠들면 안 돼요.","zh":"在图书馆里不可以大声喧哗。"}],"quiz":{"q":"想说「上课时间不可以玩手机」，正确的是？","o":["수업 시간에 핸드폰을 하면 안 돼요.","수업 시간에 핸드폰을 해야 돼요.","수업 시간에 핸드폰을 해도 돼요."],"a":0,"why":"「不可以」用 -(으)면 안 되다；해야 돼요 变成「必须玩」，해도 돼요 是「也可以玩」，意思正好相反。"}},{"pat":"-겠어요","name":"意志与推测","desc":"接法：动词、形容词词干＋겠어요。核心用法：一是说话人的意志决心，더 열심히 하겠어요；二是推测「大概会…吧」，비가 오겠어요；三是委婉应答，알겠어요＝知道了，모르겠어요＝不知道。易混点：表「我的承诺」口语更常用 -ㄹ게요，如 금방 갈게요；-겠어요 偏正式书面，多用于表决心。","ex":[{"ko":"알겠어요.","zh":"我知道了。"},{"ko":"하늘이 흐려요. 곧 비가 오겠어요.","zh":"天阴了，马上要下雨了吧。"},{"ko":"다음 학기에 더 열심히 공부하겠어요.","zh":"下学期我一定更努力学习。"}],"quiz":{"q":"答应老板「我马上过去」，口语里最自然常用的是？","o":["금방 가세요.","금방 갈게요.","금방 가요."],"a":1,"why":"表说话人当下的承诺应答，口语最常用 -ㄹ게요（-겠어요 偏正式书面）；가세요 是「请您去」，가요 只是平淡陈述。"}},{"pat":"-네요","name":"感叹","desc":"接法：动词、形容词词干＋네요。核心用法：亲眼所见、亲身体会时脱口而出的感叹「真…啊」，如 크네요＝真大啊，맛있네요＝真好吃啊；也用于发现新情况，如 벌써 10월이네요。易混点：-네요 是自己直接的感受判断；-아/어 보이다 只是「看起来」，맛있어 보여요 可能还没吃。","ex":[{"ko":"한국어가 정말 어렵네요.","zh":"韩语真的很难啊。"},{"ko":"오늘 날씨가 좋네요.","zh":"今天天气真好啊。"},{"ko":"벌써 10년이 지났네요.","zh":"已经过去10年了呢。"}],"quiz":{"q":"朋友做了菜给你吃，你尝了一口感叹「真好吃啊！」，最自然的是？","o":["정말 맛있어 보여요!","정말 맛있게 드세요!","정말 맛있네요!"],"a":2,"why":"-네요 表亲身体验后的直接感叹；맛있어 보여요 是「看起来好吃」（还没吃），맛있게 드세요 是「请享用」。"}},{"pat":"-군요/구나","name":"感悟原来","desc":"接法：词干＋군요（敬语，等于구나加요）或구나（平语）；名词后用 이군요/이구나，过去时接 -았/었군요。核心用法：知道原先不知道的事时恍然大悟「原来…啊」，如 그렇군요＝原来如此。易混点：-군요 偏获得新信息的感悟，-네요 偏带情绪的感叹；对长辈、老师必须说 군요，구나 是平语。","ex":[{"ko":"민수 씨가 대학생이군요.","zh":"民秀原来是大学生啊。"},{"ko":"아, 이렇게 하면 되는구나!","zh":"啊，原来这样做就可以了呀！"},{"ko":"오늘이 벌써 금요일이군요.","zh":"今天已经是星期五了啊。"}],"quiz":{"q":"听完老师说明后恍然大悟，想表达「原来是这样啊」，对老师应该说？","o":["그렇구나.","그렇군요.","그렇네."],"a":1,"why":"-구나、-네 是平语感悟，对老师、长辈要加요 说 -군요；그렇구나 只能对朋友说。"}},{"pat":"-(으)로","name":"方向手段助词","desc":"接法：名词有收音接으로，无收音或ㄹ收音接로。核心用法：一是方向「往…」，왼쪽으로 가세요＝请往左走；二是手段「乘、用…」，버스로 가요，한국어로 말해요；三是身份用途「作为…」，선물로 줬어요。易混点：에 强调到达终点，로 强调方向和方式，交通工具一律用로。","ex":[{"ko":"왼쪽으로 가세요.","zh":"请往左边走。"},{"ko":"저는 매일 버스로 회사에 가요.","zh":"我每天坐公交车去公司。"},{"ko":"친구 생일 선물로 책을 샀어요.","zh":"买了书作为朋友的生日礼物。"}],"quiz":{"q":"想说「坐地铁去明洞」，正确的是？","o":["지하철에 명동으로 가요.","지하철로 명동에 가요.","지하철을 명동에 가요."],"a":1,"why":"交通手段必须用 -(으)로，到达地点用 -에；을 是宾语助词，「지하철을 가요」不成立。"}},{"pat":"-처럼/-같이","name":"像一样","desc":"接法：名词＋처럼或같이，助词本身不再变形。核心用法：表「像…一样」，用于比喻和比较，如 배우처럼 예뻐요＝像演员一样漂亮；처럼 稍书面，같이 更口语，两者可互换。易混点：名词＋같아요 是推测「好像是…」，저 사람 같아요＝好像是那个人，和 처럼「照…的样子」分工不同，别混用。","ex":[{"ko":"미나 씨는 영화 배우처럼 예뻐요.","zh":"米娜像电影演员一样漂亮。"},{"ko":"저는 원어민처럼 한국어를 하고 싶어요.","zh":"我想像母语者一样说韩语。"},{"ko":"물처럼 맑은 목소리네요.","zh":"像水一样清澈的嗓音啊。"}],"quiz":{"q":"想说「民秀像熊猫一样可爱」，正确的是？","o":["민수 씨는 판다가 귀여워요.","민수 씨를 판다처럼 귀여워요.","민수 씨는 판다처럼 귀여워요."],"a":2,"why":"「像…一样」把名词直接接上 처럼/같이 即可；가 会把句子断成「熊猫可爱」，를 是宾语助词用错位置。"}},{"pat":"그래서/그런데/그러니까/하지만","name":"常用连接副词","desc":"接法：无变形，直接放在两个分句之间。核心用法：그래서＝所以，承接因果；그러니까＝所以、因此，带总结重申口吻，语气更强；그런데＝不过、然后，轻转折或补新话题；하지만＝但是，前后明确对立。易混点：그래서 和 그러니까 都表因果，后者更强调「所以说」。","ex":[{"ko":"어제는 너무 바빴어요. 그래서 점심을 못 먹었어요.","zh":"昨天太忙了，所以午饭没吃上。"},{"ko":"오늘은 날씨가 좋아요. 그런데 바람이 좀 불어요.","zh":"今天天气不错，不过有点风。"},{"ko":"한국어는 어려워요. 하지만 재미있어요. 그러니까 매일 공부해요.","zh":"韩语很难，但是很有趣，所以每天都要学。"}],"quiz":{"q":"어제 감기에 걸렸어요. ____ 학교에 못 갔어요.（昨天感冒了，所以没去学校）空格处应填？","o":["그래서","하지만","그런데"],"a":0,"why":"感冒（原因）到没去学校（结果）是因果承接，用 그래서；하지만、그런데 都表转折，逻辑不通。"}},{"pat":"존댓말과 반말","name":"敬语与平语总览","desc":"接法：敬语三件套：主语尊敬词尾 -시/-으시，如 선생님이 오세요；终结语尾 -요 或 -습니다；称呼后加 님，如 선생님。核心用法：对长辈、上级、初次见面的人、客人必须用敬语；同龄亲近的朋友和弟弟妹妹之间才用平语。易混点：-시 尊敬动作主体，-요 尊敬听话人，可同时出现。","ex":[{"ko":"선생님이 교실에 들어오세요.","zh":"老师走进教室。（-시 尊敬主语）"},{"ko":"김민수 님, 잠시만 기다리세요.","zh":"金民洙先生，请稍等。（님＋-세요 尊敬听话人）"},{"ko":"(친구한테) 밥 먹었어?","zh":"（对朋友）吃饭了吗？（반말）"}],"quiz":{"q":"刚认识的长辈跟你说话，你绝对不能用哪一种语气？","o":["존댓말","반말","해요체"],"a":1,"why":"对长辈、初次见面的人必须用敬语，说 반말 非常失礼；해요체 也是敬语的一种，可以用。"}},{"pat":"하다类动词变形总表","name":"하다类变形总表","desc":"接法：名词＋하다 构成动词，如 공부하다＝学习、요리하다＝做饭、운동하다＝运动、사랑하다＝爱，都按同一套规则变形。核心用法：现在时 해요，过去时 했어요，将来时 할 거예요，请求用 해 주세요，一个模板套所有하다类动词。易混点：하다 接아요 要合体成 해요，绝不能说 하아요。","ex":[{"ko":"저는 매일 한국어를 공부해요.","zh":"我每天学习韩语。"},{"ko":"어제 친구랑 요리를 했어요.","zh":"昨天和朋友做饭了。"},{"ko":"주말에 같이 운동을 할 거예요.","zh":"周末会一起运动。"}],"quiz":{"q":"想说「明天要运动」，正确的是？","o":["내일 운동을 하아요.","내일 운동을 했어요.","내일 운동을 할 거예요."],"a":2,"why":"하다 类将来时用 할 거예요；하아요 不存在（하다→해요），했어요 是过去「运动过了」。"}},{"pat":"ㅂ·ㄷ·ㄹ·으 불규칙","name":"不规则变形入门","desc":"接法：不规则动词遇词尾会变身，要整词背。ㅂ不规则：ㅂ变우接어요成워요，如 춥다→추워요、덥다→더워요；ㄷ不规则：ㄷ变ㄹ，如 듣다→들어요；으脱落：쓰다→써요、바쁘다→바빠요；ㄹ收音词在ㄴ、ㅂ、ㅅ前脱落，如 사는、삽니다。易混点：입다、잡다 是规则动词，说 입어요，别套ㅂ不规则。","ex":[{"ko":"오늘은 날씨가 추워요.","zh":"今天天气很冷。（ㅂ不规则）"},{"ko":"매일 아침 뉴스를 들어요.","zh":"每天早上听新闻。（ㄷ不规则）"},{"ko":"요즘 시험 준비 때문에 너무 바빠요.","zh":"最近因为准备考试，特别忙。（으脱落）"}],"quiz":{"q":"想说「今天好热」，正确的是？","o":["오늘은 정말 더워요.","오늘은 정말 더웁어요.","오늘은 정말 덥어요."],"a":0,"why":"덥다 是 ㅂ不规则，接 아/어 时 ㅂ→워，变成 더워요；덥어요 是按规则硬套的典型错误。"}}],"sents":[{"scene":"问候寒暄","ko":"안녕하세요!","zh":"你好！"},{"scene":"问候寒暄","ko":"좋은 아침이에요.","zh":"早上好。"},{"scene":"问候寒暄","ko":"밥 먹었어요?","zh":"吃饭了吗？"},{"scene":"问候寒暄","ko":"잘 지내요?","zh":"最近过得好吗？"},{"scene":"问候寒暄","ko":"오랜만이에요.","zh":"好久不见。"},{"scene":"问候寒暄","ko":"반가워요!","zh":"见 function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad2(n){return (n<10?'0':'')+n}
function todayKey(d){try{d=d||new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}catch(e){return"1970-01-01"}}
function addDays(k,n){const d=new Date(k+"T12:00:00");d.setDate(d.getDate()+n);return todayKey(d)}
function lastNDates(n){const out=[];let d=todayKey();for(let i=0;i<n;i++){out.push(d);d=addDays(d,-1)}return out}
function dayDiff(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000)}
/* 确定性伪随机（组卷按日期稳定，同一数据同一试卷） */
function seededRand(seed){let s=seed>>>0||1;return function(){s^=s<<13;s^=s>>>17;s^=s<<5;return ((s>>>0)%100000)/100000}}
function hashStr(t){let h=0;t=String(t);for(let i=0;i<t.length;i++){h=(h*31+t.charCodeAt(i))>>>0}return h}
function pickN(arr,n,rand){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor((rand?rand():Math.random())*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a.slice(0,Math.max(0,n))}

function beep(f,d){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;beep.ctx=beep.ctx||new C();if(beep.ctx.state==="suspended")beep.ctx.resume();const o=beep.ctx.createOscillator(),g=beep.ctx.createGain();o.frequency.value=f;o.type="sine";g.gain.setValueAtTime(.08,beep.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,beep.ctx.currentTime+(d||.12));o.connect(g);g.connect(beep.ctx.destination);o.start();o.stop(beep.ctx.currentTime+(d||.12))}catch(e){}}

/* ---- A2. 状态与三键 ---- */

/* ---- A3. KRSTORE 存储引擎（IndexedDB＋镜像双保险） ---- */
const KRSTORE=(function(){
  let ready=false,engine="localStorage",adoptDone=false,_lsWarnTs=0;

  function lsOK(k,v){
    try{localStorage.setItem(k,JSON.stringify(v));return true}

  function isEmptyOf(o,which){
    try{

/* ---- A4. FSRS 记忆调度（ts-fsrs 5.4.2 · 按天排期） ---- */
let KRFSRS_F=null;

function fsrsInst(){

function srsAnswer(id,grade,today){

  const F=fsrsInst();
  if(F){
    try{
      const GM=[FSRS.Rating.Again,FSRS.Rating.Hard,FSRS.Rating.Good,FSRS.Rating.Easy];
      const R=GM[grade]!=null?GM[grade]:FSRS.Rating.Good;
      const f=st.fsrs;

        card={due:f.due?new Date(f.due):new Date(),stability:f.s,difficulty:f.d,elapsed_days:f.ed||0,last_review:f.lr?new Date(f.lr):null,reps:f.reps||0,lapses:f.la||0,state:f.st||0};
      }else{

        card=FSRS.createEmptyCard(new Date(today+"T12:00:00"));
      }
      const now=new Date(today+"T12:00:00");
      const nxt=F.next(card,now,R).card;
      const dueD=new Date(nxt.due);
      st.fsrs={s:+Number(nxt.stability).toFixed(3),d:+Number(nxt.difficulty).toFixed(3),ed:nxt.elapsed_days||0,
               lr:(nxt.last_review?new Date(nxt.last_review).toISOString():""),reps:nxt.reps||0,la:nxt.lapses||0,st:nxt.state||0,due:dueD.toISOString()};

/* 主入口：播放一组韩语文本（list 元素 {t, pause}），done 结束回调（成功/失败都回调）。

    el.onplaying=function(){

  }catch(e){failOnce()}
}
function playG(t,ok,fail){

    if(fin)return;fin=true;

/* ---- A6. 内容索引（KRD 由构建注入） ---- */
const KRD=(typeof KRD_CONTENT!=="undefined")?KRD_CONTENT:{hangul:{letters:{},lessons:[]},vocab:[],gram:[],sents:[]};

const LBYID={};LESSONS.forEach(function(l){LBYID[l.id]=l});
const LETTERS_ORDER=(function(){const out=[];LESSONS.forEach(function(l){(l.letters||[]).forEach(function(x){if(out.indexOf(x)<0)out.push(x)})});return out})();
/* 词汇键：uid（同形异义词构建期生成）优先，其次词面 */
function vkey(w){return w.uid||w.ko}
const VBYKO={};(KRD.vocab||[]).forEach(function(w,i){const key=vkey(w);if(!VBYKO[key]){w.i=i;VBYKO[key]=w}});
const VOCAB=(KRD.vocab||[]).filter(function(w){return VBYKO[vkey(w)]===w});
const GRAM=KRD.gram||[];
const SENTS=KRD.sents||[];
const PACKS=(function(){const m={},out=[];VOCAB.forEach(function(w){if(!m[w.pack]){m[w.pack]=1;out.push(w.pack)}});return out})();
const PACKNAME={greet:"打招呼",people:"人称家庭",number:"数字量词",time:"时间日期",food:"食物饮品",shop:"购物衣物",place:"场所建筑",move:"交通方位",study:"学习职业",hobby:"兴趣运动",body:"身体健康",weather:"天气季节",verbs:"高频动词",adjs:"高频形容词",funcs:"疑问副词"};
function packName(p){return PACKNAME[p]||p}
/* 卡片统一视图：h 字母 / v 词汇 / g 语法 */
const ALLCARDS=(function(){
  const out=[];
  LETTERS_ORDER.forEach(function(ch){
    const L=KRD.hangul.letters[ch];if(!L)return;
    const exSyl=(String(L.ex||"").split("|")[0]||"").charAt(0)||ch;
    out.push({id:"h:"+ch,ty:"h",ko:ch,name:L.n,zh:L.zh,ex:L.ex||"",say:exSyl});
  });
  VOCAB.forEach(function(w){out.push({id:"v:"+vkey(w),ty:"v",ko:w.ko,zh:w.zh,pos:w.pos||"",ex:w.ex||"",exzh:w.exzh||"",pack:w.pack,say:w.ko})});
  GRAM.forEach(function(g,i){out.push({id:"g:"+i,ty:"g",ko:g.pat,zh:g.name,ex:(g.ex&&g.ex[0]&&g.ex[0].ko)||"",say:(g.ex&&g.ex[0]&&g.ex[0].ko)||"",gi:i})});
  return out;
})();
const CARDBYID={};ALLCARDS.forEach(function(c){CARDBYID[c.id]=c});
/* 新卡课程顺序：字母按课序 → 词汇按包序 → 语法按点序 */
const CUR_ORDER=(function(){
  const out=[];

  VOCAB.forEach(function(w){out.push("v:"+w.ko)});

function vocabGateOpen(){return Object.keys(PZ.hangul.lessons).length>=3||!!PZ.hangul.grad}

/* ---- A7. 每日组卷（确定性：同日同数据同卷） ---- */
function buildDaily(today){
  today=today||todayKey();
  if(PZ.daily&&PZ.daily.date===today&&Array.isArray(PZ.daily.queue)&&PZ.daily.queue.length)return PZ.daily;
  const target=clamp(PZ.cfg.dailyN||20,5,50);
  const rand=seededRand(hashStr("kr"+today));
  const due=srsDueList(today).slice(0,Math.min(10,Math.ceil(target*0.5))).map(function(c){return{k:"srs",id:c.id}});
  const fresh=srsNewList(today).map(function(id){return{k:"srs",id:id}});
  /* 语法小测：按课程顺序推进（未开闸或已学完则不进卷），不随机跳课 */
  let gPool=[];
  if(vocabGateOpen()){
    for(let i=0;i<GRAM.length&&gPool.length<clamp(PZ.cfg.gramDay||2,1,6);i++){
      if(!PZ.gram.learned[i])gPool.push(i);
    }
  }
  const sPool=[];for(let i=0;i<SENTS.length;i++)sPool.push(i);
  const listens=pickN(sPool,Math.min(clamp(PZ.cfg.listenDay||3,0,10),SENTS.length),rand).map(function(si){return{k:"listen",si:si}});
  const usedSi={};listens.forEach(function(q){usedSi[q.si]=1});
  let queue=due.concat(fresh).concat(gPool.map(function(gi){return{k:"gram",gi:gi}})).concat(listens);
  /* 不足 target：从到期卡（超出 cap 的部分）与题库听力补 */
  if(queue.length<target){
    const moreDue=srsDueList(today).slice(Math.min(10,Math.ceil(target*0.5))).map(function(c){return{k:"srs",id:c.id}});
    queue=queue.concat(moreDue);
  }
  if(queue.length<target){
    /* 听力补卷上限 6：零基础前几天认字课还没过关，卷子短一点是正常状态 */
    const extra=pickN(sPool.filter(function(i){return !usedSi[i]}),Math.min(target-queue.length,6),rand).map(function(si){return{k:"listen",si:si}});
    queue=queue.concat(extra);
  }
  queue=queue.filter(function(q){return q.k!=="srs"||!!CARDBYID[q.id]}); /* 内容更新后的陈旧引用不入卷 */
  queue=queue.slice(0,target);
  /* 交错排列（复习穿插新学），但保持确定性 */
  const byK={srs:[],gram:[],listen:[]};
  queue.forEach(function(q){(byK[q.k]=byK[q.k]||[]).push(q)});
  const mixed=[];const keys=["srs","gram","listen"];
  let turnaround=true;
  while(mixed.length<queue.length){
    let placed=false;
    for(const kk of keys){
      if(byK[kk]&&byK[kk].length){mixed.push(byK[kk].shift());placed=true}
    }
    if(!placed)break;
  }
  /* 交错可能改变总数，补回被丢的 */
  for(const kk of keys){(byK[kk]||[]).forEach(function(q){mixed.push(q)})}
  PZ.daily={date:today,queue:mixed,idx:0};
  persist();
  return PZ.daily;
}
function dailyDoneToday(today){const d=PZ.daily;return !!(d&&d.date===today&&d.queue.length&&d.idx>=d.queue.length)}

/* ---- A8. 错题本（答错即收 · 答对一次降频 · 全懂×2 消灭） ---- */
function wbKey(q){return q.k==="srs"?("w:"+q.id):(q.k==="gram"?("wg:"+q.gi):("wl:"+q.si))}
function wbAdd(q,snap){
  const k=wbKey(q);
  const it=WB.items[k]||(WB.items[k]={k:k,wrongN:0,first:"",last:"",cool:0,done:0});
  it.ty=q.k;it.ref=q.k==="srs"?q.id:(q.k==="gram"?q.gi:q.si);
  it.wrongN++;it.first=it.first||todayKey();it.last=todayKey();it.done=0;it.cool=0; /* 再次答错：从降频区拉回待重练 */
  if(snap)it.snap=snap;
  persist();return it;
}
function wbRight(k){ /* 重练答对：一次降频（cool），两次消灭 */
  const it=WB.items[k];if(!it)return;
  it.cool=(it.cool||0)+1;
  if(it.cool>=2)it.done=1;
  persist();
}
function wbActiveList(){return Object.keys(WB.items).filter(function(k){return !WB.items[k].done&&!(WB.items[k].cool>0)}).map(function(k){return WB.items[k]})}
function wbCoolList(){return Object.keys(WB.items).filter(function(k){return !WB.items[k].done&&WB.items[k].cool>0}).map(function(k){return WB.items[k]})}
function wbStats(){const all=Object.keys(WB.items).map(function(k){return WB.items[k]});
  return{total:all.length,active:all.filter(function(i){return !i.done}).length,dead:all.filter(function(i){return i.done}).length}}

/* ---- A9. 学习日志 ---- */
function logToday(ok,what){
  const t=todayKey();
  const d=S.days[t]||(S.days[t]={n:0,ok:0});
  d.n++;if(ok)d.ok++;

    const w=String(what||"");

    S.log.push({d:t,t:new Date().toTimeString().slice(0,5),k:w.split("|")[0]||"答题",id:w.split("|").slice(1).join("|"),ok:ok?1:0});
    if(S.log.length>4000)S.log.splice(0,S.log.length-4000);
  }catch(e){}
  persist();
}
function streak(today){
  let s=0,d=today||todayKey();
  while(S.days[d]&&S.days[d].n>0){s++;d=addDays(d,-1)}
  return s;
}

/* ---- 한글课程练习 ---- */
function genLetterQuiz(chars,n,allPool){
  const pool=[];
  (allPool||chars).forEach(function(ch){
    const L=HANGUL.letters[ch];if(!L)return;
    const others=LETTERS_ORDER.filter(function(x){return x!==ch&&HANGUL.letters[x]});
    const v=mkOpts(L.zh,pickN(others,6).map(function(x){return HANGUL.letters[x].zh}));
    pool.push({ty:"hz",ch:ch,o:v.o,a:v.a,why:"口诀："+(L.tip||"")+"（"+L.zh+"）"});
    const saySyl=String(L.ex||"").split("|")[0].charAt(0)||ch;
    const av=mkOpts(ch,pickN(others,6));
    pool.push({ty:"ha",say:saySyl,ans:ch,o:av.o,a:av.a,why:"听到的音是 "+ch+"（"+L.n+"："+L.zh+"）"});
  });
  return pickN(pool,n||10);
}
function genRuleQuiz(n){
  const pool=[];
  HANGUL.soundRules.forEach(function(r){
    const others=[];
    HANGUL.soundRules.forEach(function(r2){if(r2!==r)r2.ex.forEach(function(e2){others.push(e2.say)})});
    r.ex.forEach(function(e){
      const v=mkOpts(e.say,pickN(others,6));
      pool.push({ty:"rule",ko:e.ko,o:v.o,a:v.a,why:r.name+"："+e.ko+" 读 ["+e.say+"]（"+e.zh+"）"});
    });
  });
  return pickN(pool,n||12);
}
function startPrac(){
  const l=LESSONS[GO.li];if(!l)return;
  let items;
  if(l.id==="L10"){items=pickN(genLetterQuiz(LETTERS_ORDER,99,LETTERS_ORDER).slice(0,8).concat(genRuleQuiz(4)),12)}
  else if(l.id==="L9")items=genRuleQuiz(10);
  else items=genLetterQuiz(l.letters,Math.min(10,l.letters.length*2));
  PRAC={li:GO.li,items:items,idx:0,right:0,_log:[]};
  DI=null;GO.v="prac";render();
}
function pracHTML(){
  const l=LESSONS[PRAC.li];
  if(PRAC.idx>=PRAC.items.length)return pracEnd(l);
  const it=PRAC.items[PRAC.idx];
  let h=topbar("hangul","练习 · "+l.name,'<span class="tb-act">'+(PRAC.idx+1)+"/"+PRAC.items.length+'</span>');
  h+='<div class="dots">';
  PRAC.items.forEach(function(_,i){h+='<i class="'+(i<PRAC.idx?(PRAC._log[i]?"done-ok":"done-bad"):(i===PRAC.idx?"cur":""))+'"></i>'});
  h+='</div>';
  if(it.ty==="hz"){
    h+='<div class="qcard fadein"><div class="qtag">这个字母读什么？</div><div class="lbig ko">'+esc(it.ch)+'</div>'+optBtns(it.o,it.a,'pracPick')+'</div>';
  }else if(it.ty==="ha"){
    h+='<div class="qcard fadein"><div class="qtag">听音选字母（可重听）</div><div style="text-align:center;margin:8px 0"><button class="spk" onclick="speakOne(\''+sayAttr(it.say)+'\')">🔊 重听 '+esc(it.say)+'</button>'+gSpk(it.say)+'</div>'+optBtns(it.o,it.a,'pracPick',true)+'</div>';
    if(!DI||DI.picked==null){const pi=PRAC.idx,sayNow=it.say;
      setTimeout(function(){if(GEST.seen&&GO.v==="prac"&&PRAC&&PRAC.idx===pi&&(!DI||DI.picked==null))speakOne(sayNow)},350);
    }
  }else{
    h+='<div class="qcard fadein"><div class="qtag">实际读音是哪个？</div><div class="qko ko">'+esc(it.ko)+'</div>'+optBtns(it.o,it.a,'pracPick',true)+'</div>';
  }
  if(DI&&DI.picked!=null){
    const corr=it.ty==="ha"?it.ans+"（"+(HANGUL.letters[it.ans]||{}).zh+"）":it.o[it.a];
    h+=verdictHTML(DI.right,corr,it.why);
    h+='<button class="btn wide" onclick="pracNext()">下一题 →</button>';
  }
  return h;
}
function pracPick(i){
  if(!PRAC||(DI&&DI.picked!=null))return;
  const it=PRAC.items[PRAC.idx];
  const ok=i===it.a;
  DI={picked:i,right:ok};
  PRAC._log[PRAC.idx]=ok;
  if(ok){PRAC.right++;beep(660,.1)}
  else{beep(220,.16);
    const snap={custom:true,ty:it.ty,ch:it.ch,ans:it.ans||it.ch,say:it.say,ko:it.ko,o:it.o,a:it.a,why:it.why};
    wbAdd({k:"srs",id:"whangul:"+(it.ans||it.ch||it.ko)},snap);
  }
  logToday(ok,"한글|"+(it.ans||it.ch||it.ko||""));
  render();
}

/* ================= 每日训练 ================= */
function prepareOpts(){
  const d=PZ.daily;
  if(GO.v!=="daily"||!d||!d.queue||d.idx>=d.queue.length)return;
  const q=d.queue[d.idx];
  const ref=d.date+"#"+d.idx+":"+(q.k==="srs"?q.id:(q.k==="gram"?"g"+q.gi:"l"+q.si));
  if(DI===null||DI.qref!==ref||!DI.o){
    DI={qref:ref,qi:d.idx,picked:null,o:null,a:-1,kind:"",say:""};
    if(q.k==="srs"){
      const c=CARDBYID[q.id];const st=PZ.srs.cards[c.id]||{n:0};
      if(c.ty==="h"){
        const others=LETTERS_ORDER.filter(function(x){return x!==c.ko&&HANGUL.letters[x]});
        if(st.n%2===1){const m=mkOpts(c.ko,pickN(others,6));DI.o=m.o;DI.a=m.a;DI.say=c.say;DI.kind="ha"}
        else{const m=mkOpts(c.zh,pickN(others,6).map(function(x){return HANGUL.letters[x].zh}));DI.o=m.o;DI.a=m.a;DI.kind="hz"}
      }else if(c.ty==="v"){
        const mode=st.n%3;
        const correct=mode===1?c.ko:c.zh;
        const samePack=VOCAB.filter(function(w){return w.pack===c.pack&&w.ko!==c.ko});
        const srcPool=samePack.length>=5?samePack:VOCAB.filter(function(w){return w.ko!==c.ko});
        const m=mkOpts(correct,pickN(srcPool,8).map(function(w){return mode===1?w.ko:w.zh}));
        DI.o=m.o;DI.a=m.a;DI.kind=mode===2?"vl":(mode===1?"vk":"vz");DI.say=c.ko;
      }else{const g=GRAM[c.gi];DI.o=g.quiz.o;DI.a=g.quiz.a;DI.kind="gq"}
    }else if(q.k==="gram"){const g=GRAM[q.gi];DI.o=g.quiz.o;DI.a=g.quiz.a;DI.kind="gq"}
    else{
      const s=SENTS[q.si];
      const others=SENTS.filter(function(x,i){return i!==q.si}).map(function(x){return x.zh});
      const m=mkOpts(s.zh,pickN(others,8));
      DI.o=m.o;DI.a=m.a;DI.kind="listen";DI.say=s.ko;
    }
  }
}
function daily(){
  const t=todayKey();
  const d=buildDaily(t);
  /* 正在展示当前题的解析视图时不跳题（否则答完的解析一闪而过） */
  const cur=d.queue[d.idx];
  const curRef=cur?(d.date+"#"+d.idx+":"+(cur.k==="srs"?cur.id:(cur.k==="gram"?"g"+cur.gi:"l"+cur.si))):"";
  const showing=DI&&DI.qref===curRef&&DI.picked!=null;
  if(!showing){
    /* 已答未推进（答完即切走再回来）与内容更新后的陈旧卡：直接推进，不重考 */
    let skipped=0;
    while(d.idx<d.queue.length){
      const qq=d.queue[d.idx];
      if(qq._ok!==undefined){d.idx++;skipped++}
      else if(qq.k==="srs"&&!CARDBYID[qq.id]){qq._ok=true;d.idx++;skipped++}
      else break;
    }
    if(skipped){DI=null;persist()}
  }
  if(d.idx>=d.queue.length)return dailyEnd(d);
  const q=d.queue[d.idx];
  let h='<div class="topbar"><h2>📅 今日训练</h2><span class="tb-act">'+(d.idx+1)+"/"+d.queue.length+'</span></div>';
  h+='<div class="dots">';
  d.queue.forEach(function(x,i){h+='<i class="'+(i<d.idx?(x._ok?"done-ok":"done-bad"):(i===d.idx?"cur":""))+'"></i>'});
  h+='</div>';
  if(q.k==="srs")h+=dailySRS(CARDBYID[q.id]);
  else if(q.k==="gram"){
    const g=GRAM[q.gi];
    h+='<div class="qcard fadein"><div class="qtag">🧩 语法 · '+esc(g.name)+'</div><div class="qtext">'+esc(g.quiz.q)+'</div>'+optBtns(DI.o,DI.a,'dailyPick')+'</div>';
  }else{
    h+='<div class="qcard fadein"><div class="qtag">🎧 听音选义（可重听）</div><div style="text-align:center;margin:8px 0"><button class="spk" onclick="speakOne(\''+sayAttr(DI.say)+'\')">🔊 重听</button>'+gSpk(DI.say)+'</div>'+optBtns(DI.o,DI.a,'dailyPick')+'</div>';
  }
  if(DI&&DI.picked!=null){
    const corr=q.k==="srs"?srsCorrectText(CARDBYID[q.id]):(q.k==="gram"?GRAM[q.gi].quiz.o[GRAM[q.gi].quiz.a]:SENTS[q.si].ko+" —— "+SENTS[q.si].zh);
    const why=q.k==="gram"?GRAM[q.gi].quiz.why:"";
    h+=verdictHTML(DI.right,corr,why);
    h+='<button class="btn wide" onclick="dailyNext()">下一题 →</button>';
  }
  h+='<div class="hint" style="text-align:center;margin:12px">中途退出不丢进度，随时回来</div>';
  return h;
}
function srsCorrectText(c){
  if(!c)return"";

  if(c.ty==="g")return GRAM[c.gi].quiz.o[GRAM[c.gi].quiz.a];
  if(c.ty==="h")return c.ko+"（"+c.zh+"）";
  return c.ko;
}

  WBI=[];
  function row(it,coolFlag){
    let prev="";

    if(snap.custom){
      if(snap.ty==="listen")prev='<span class="ko">'+esc(snap.ko)+"</span> → "+esc(snap.zh);

      else if(snap.ty==="rule")prev="音变 "+esc(snap.ko||"");

    }else{
      const c=CARDBYID[it.ref];

/* ---- 导出/导入 ---- */
function csvEsc(v){v=String(v==null?"":v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
/* 答题明细导出：CSV（带 BOM，Excel/WPS 直接开，Access/Numbers 可导入建库查询） */
function exportCSV(){
  const log=S.log||[];
  if(!log.length){toast("还没有答题明细——先做几道题再导出");return}
  const rows=[["日期","时间","模块","条目","结果"]];
  log.forEach(function(e){rows.push([e.d,e.t,e.k,e.id,e.ok?"对":"错"])});
  const csv="\ufeff"+rows.map(function(r){return r.map(csvEsc).join(",")}).join("\r\n");
  try{
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="韩语训练答题明细-"+todayKey().replace(/-/g,"")+".csv";
    document.body.appendChild(a);a.click();
    setTimeout(function(){try{document.body.removeChild(a);URL.revokeObjectURL(a.href)}catch(e){}},800);
    toast("✅ 答题明细已导出："+log.length+" 条（Excel/WPS/Access 可直接打开导入）");
  }catch(e){toast("导出失败："+e.message)}
}
function exportBackup(){

    const a=document.createElement("a");

}
let importStash=null;
function importBackup(input){
  const f=input.files&&input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=function(){
    let o;try{o=JSON.parse(String(r.result))}catch(e){toast("文件不是合法 JSON");return}
    if(!o||o.app!=="krtrain"){toast("不是韩语每日训练的备份文件");return}
    const cnt=o.PZ&&o.PZ.srs&&o.PZ.srs.cards?Object.keys(o.PZ.srs.cards).length:0;
    const when=o._ts?new Date(o._ts).toLocaleString("zh-CN"):"未知时间";

    showModal('<h3>导入备份</h3><div class="hint">备份时间：'+esc(when)+" · 记忆卡 "+cnt+' 张</div>'
      +'<div class="explain small" style="margin-top:8px"><b>合并导入</b>（推荐）：进度只增不减，与云同步同款逻辑。<br><b style="color:var(--accent2)">整体覆盖</b>：以备份为准，丢弃其后在本机的进度。</div>'
      +'<div class="btnrow" style="margin-top:10px"><button class="btn gray" onclick="closeModal()">取消</button>'
      +'<button class="btn ghost" onclick="importGo(1)">合并导入</button>'
      +'<button class="btn warn" onclick="importGo(0)">整体覆盖</button></div>');
  };
  r.readAsText(f);
}

function gistPush(){
  const body={files:{}};body.files[gistFileName()]={content:KRSTORE.exportAll()};
  return fetch("https://api.github.com/gists/"+encodeURIComponent(PZ.cfg.gistid),{method:"PATCH",headers:ghHeaders(),body:JSON.stringify(body)})
  .then(function(r){if(!r.ok)throw new Error("推送失败 HTTP "+r.status);return r.json()});

function mergeFromRemote(remote){
  let touched=0;
  try{
    if(remote.S&&remote.S.days){for(const k in remote.S.days){if(!dayEntryValid(remote.S.days[k]))continue;if(!S.days[k]||(remote.S.days[k].n||0)>(S.days[k].n||0)){S.days[k]=remote.S.days[k];touched++}}}
    if(remote.S&&Array.isArray(remote.S.log)){ /* 答题明细并集去重（CSV 存档同步保留） */
      S.log=S.log||[];
      const seen={},out=[];
      const put=function(e){if(!e||typeof e!=="object")return;
        const k=(e.d||"")+""+(e.t||"")+""+(e.k||"")+""+(e.id||"")+""+(e.ok|0);
        if(seen[k])return;seen[k]=1;
        out.push({d:String(e.d||""),t:String(e.t||"").slice(0,5),k:String(e.k||"答题").slice(0,12),id:String(e.id||"").slice(0,80),ok:e.ok?1:0})};
      S.log.forEach(put);
      const before=out.length;
      remote.S.log.forEach(put);
      if(out.length>before)touched++;
      S.log=out.slice(-4000);
    }
    if(remote.WB&&remote.WB.items){for(const k in remote.WB.items){
      if(!wbKeySafe(k)||!wbEntryValid(remote.WB.items[k]))continue;
      const r=remote.WB.items[k],l=WB.items[k];
      if(!l){WB.items[k]=r;touched++}
      else{
        if((r.wrongN||0)>(l.wrongN||0))l.wrongN=r.wrongN;
        if(r.done&&!l.done){l.done=1;touched++}
        if((r.cool||0)>(l.cool||0)){l.cool=r.cool;touched++}
      }
    }}
    if(remote.PZ&&remote.PZ.srs&&remote.PZ.srs.cards){
      PZ.srs.cards=PZ.srs.cards||{};
      for(const k in remote.PZ.srs.cards){
        const r=remote.PZ.srs.cards[k],l=PZ.srs.cards[k];
        if(!cardEntryValid(r))continue;
        if(cardScore(r)>cardScore(l)){PZ.srs.cards[k]=r;touched++} /* 择优键含兜底卡的作答次数 n */
      }
      if(remote.PZ.srs.log)for(const k in remote.PZ.srs.log){PZ.srs.log[k]=Math.max(PZ.srs.log[k]||0,remote.PZ.srs.log[k])}
    }
    if(remote.PZ&&remote.PZ.gram&&remote.PZ.gram.learned){for(const k in remote.PZ.gram.learned){if(!PZ.gram.learned[k]){PZ.gram.learned[k]=remote.PZ.gram.learned[k];touched++}}}
    if(remote.PZ&&remote.PZ.hangul){
      for(const k in (remote.PZ.hangul.lessons||{})){if(!PZ.hangul.lessons[k]){PZ.hangul.lessons[k]=remote.PZ.hangul.lessons[k];touched++}}
      if(remote.PZ.hangul.grad&&!PZ.hangul.grad)PZ.hangul.grad=remote.PZ.hangul.grad;
    }
    if(remote.PZ&&remote.PZ.listen&&remote.PZ.listen.done)for(const k in remote.PZ.listen.done){if(!PZ.listen.done[k]){PZ.listen.done[k]=1;touched++}}
  }catch(e){}
  if(touched){KRSTORE.renorm();persist()}
  return touched;
}
function gistSync(twoWay){
  if(!PZ.cfg.token||!PZ.cfg.gistid){toast("需要令牌＋备份 ID（没有就先「创建新云备份」）");return}
  toast("同步中…");
  let merged=0;
  gistPull().then(function(remote){
    merged+=mergeFromRemote(remote);
    return gistPull(); /* 推送前重拉合并：压窄双设备互踩窗口 */
  }).then(function(remote){
    merged+=mergeFromRemote(remote);
    if(!twoWay){
      PZ.cfg.lastSync=Date.now();persist();render();
      toast(merged?("✅ 拉取合并完成，合并 "+merged+" 处"):"✅ 云端没有新东西");
      return null;
    }
    return gistPush().then(function(){
      PZ.cfg.lastSync=Date.now(); /* 推送成功才算同步成功 */
      persist();render();
      toast(merged?("✅ 双向同步完成，合并 "+merged+" 处"):"✅ 双向同步完成");
    });
  }).catch(function(e){toast("同步失败："+e.message)});
}
function autoSync(){
  if(!PZ.cfg.token||!PZ.cfg.gistid)return;
  if(Date.now()-(PZ.cfg.lastSync||0)<20*3600*1000)return;
  gistPull().then(function(remote){mergeFromRemote(remote);return gistPull()})
  .then(function(remote){mergeFromRemote(remote);return gistPush()})
  .then(function(){PZ.cfg.lastSync=Date.now();persist()})
  .catch(function(){});
}

/* ================= 渲染主循环 ================= */
function navbar(act){
  const due=srsDueList(todayKey()).length;
  const wbN=wbStats().active;
  const items=[["home","🏠","主页"],["daily","📅","每日"],["hangul","📖","한글"],["vocab","🗃️","词汇"],["stats","📊","我的"]];
  function isOn(key){
    if(act===key)return true;
    if(key==="hangul")return act==="prac"||act==="lesson";
    if(key==="vocab")return act==="flash"||act==="vpack";
    if(key==="home")return act==="wb"||act==="wbdrill"||act==="settings"||act==="listen"||act==="ldrill"||act==="gram"||act==="gdetail";
    return false;
  }
  let h='<div class="navbar">';
  items.forEach(function(it){
    let bdg="";
    if(it[0]==="daily"&&due>0)bdg='<span class="bdg">'+due+'</span>';
    if(it[0]==="home"&&wbN>0)bdg='<span class="bdg">'+wbN+'</span>';
    h+='<button class="'+(isOn(it[0])?"on":"")+'" onclick="nav(\''+it[0]+'\')"><span class="ni">'+it[1]+'</span>'+it[2]+bdg+'</button>';
  });
  return h+'</div>';
}
function render(){
  prepareOpts();
  let h="";
  switch(GO.v){
    case "home":h=home();break;
    case "hangul":h=hangul();break;
    case "lesson":h=lesson();break;
    case "prac":h=PRAC?pracHTML():home();break;
    case "vocab":h=vocab();break;
    case "vpack":h=vpack();break;
    case "flash":h=FLASH?flashHTML():vocab();break;
    case "gram":h=gram();break;
    case "gdetail":h=gdetail();break;
    case "listen":h=listen();break;
    case "ldrill":h=LDRILL?ldrillHTML():listen();break;
    case "daily":h=daily();break;
    case "wb":h=wb();break;
    case "wbdrill":h=WBDRILL?wbdrillHTML():wb();break;
    case "stats":h=stats();break;
    case "settings":h=settings();break;
    default:h=home();
  }
  document.getElementById("app").innerHTML=h+navbar(GO.v);
  if(GO.v==="daily"&&DI&&DI.picked==null&&(DI.kind==="vl"||DI.kind==="ha"||DI.kind==="listen")&&DI.say){
    const sayNow=DI.say,qiNow=DI.qi;
    setTimeout(function(){
      if(GEST.seen&&GO.v==="daily"&&DI&&DI.qi===qiNow&&DI.picked==null){try{speakOne(sayNow)}catch(e){}}
    },420);
  }
}

/* ================= 启动 ================= */
function boot(){
  lsSeed(); /* 先同步读 localStorage 镜像播种，再与 IndexedDB 对账 */
  try{ /* 双开同一文件（双标签/分屏）：另一窗写入镜像时并集合并进内存，防后写覆盖 */
    window.addEventListener("storage",function(e){
      if(e.key===LS||e.key===LSW||e.key===LSP){mergeFromMirror();if(GO.v==="daily")prepareOpts();render()}
    });
  }catch(e){}
  try{ /* 音频手势解锁与路线自愈 */
    document.addEventListener("pointerdown",function(){GEST.seen=true},{passive:true,capture:true});
    window.addEventListener("focus",function(){AUD.sysDead=false;AUD.sysFails=0;AUD.gFails=0;AUD.eDead=false;AUD.eFails=0},true);
  }catch(e){}
  KRSTORE.adopt().then(function(){
    applyTheme();
    if(PZ.daily&&PZ.daily.date!==todayKey())PZ.daily={date:"",queue:[],idx:0};
    render();
    try{
      if(typeof speechSynthesis!=="undefined"){
        speechSynthesis.getVoices();
        speechSynthesis.onvoiceschanged=function(){
          if(koVoices().length){AUD.sysDead=false;AUD.sysFails=0}
          if(GO.v==="settings")render();
        };
      }
    }catch(e){}
    try{autoSync()}catch(e){}
  }).catch(function(){render()});
}
if(typeof document!=="undefined"){
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
  else boot();
}
